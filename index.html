<!DOCTYPE html>
<html lang="en">
  
  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasatria Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    
  </head>
  
  <body>
    
    <!-- google login -->
    
    <div id="login-screen">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in with your Google account to access!.</p>
        <div id="google-signin-btn"></div>
      </div>
    </div>
    
    <!-- 3D view -->
    
    <div id="visualization-screen" class="hidden">
      <div id="container"></div>

      
      <div id="sort-menu">
        <span class="sort-label">Sort Net Worth:</span>
        <button id="sort-default" class="sort-btn active">Default</button>
        <button id="sort-asc" class="sort-btn">Increasing (&uarr;)</button>
        <button id="sort-desc" class="sort-btn">Decreasing (&darr;)</button>
      </div>
      
      <div id="menu">
        <button id="table" class="active">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
        <button id="pyramid">PYRAMID</button>
      </div>
      
      <div id="legend">
        <span>LOW (&lt;$100K)</span>
        <div class="legend-bar"></div>
        <span>HIGH (&gt;$200K)</span>
      </div>
    </div>
    
    <script src="app.js"></script>
    
  </body>
  
</html>
